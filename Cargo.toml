[workspace]
members = ["crates/twine_git_server", "crates/twine_git_operations"]

[workspace.dependencies]
axum = "0.8.8"
color-eyre = { version = "0.6.5", features = ["capture-spantrace", "issue-url"] }
confique = { version = "0.4.0", features = ["toml"] }
dotenvy = "0.15.7"
eyre = "0.6.12"
twine_git_server = { path = "crates/twine_git_server" }
twine_git_operations = { path = "crates/twine_git_operations" }
git2 = { version = "0.20.2", default-features = false, features = ["vendored-libgit2"] }
gix = { version = "0.74.1", features = ["tracing", "parallel", "blob-diff", "revision"] }
hashbrown = { version = "0.15.4", features = ["serde"] }
itertools = "0.14.0"
moka = { version = "0.12.10", features = ["future"] }
rocksdb = { version = "0.24.0", default-features = false, features = ["snappy"] }
utoipa = { version = "5.4.0", features = ["auto_into_responses", "axum_extras", "chrono", "config", "debug", "url", "uuid"] }
utoipa-scalar = { version = "0.3.0", features = ["axum"] }
yoke = { version = "0.8.0", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.49.0", features = ["full"] }
tower = { version = "0.5.2", features = ["util"] }
tracing = "0.1.43"
tracing-error = "0.2.1"
tracing-subscriber = { version = "0.3.22", features = ["chrono", "env-filter", "time"] }

[package]
name = "twine"
version = "0.1.0"
edition = "2024"

[dependencies]
axum.workspace = true
color-eyre.workspace = true
confique.workspace = true
dotenvy.workspace = true
eyre.workspace = true
twine_git_server.workspace = true
twine_git_operations.workspace = true
rocksdb.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-error.workspace = true
tracing-subscriber.workspace = true
